<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 2rem; }
        .card { max-width: 420px; margin: 0 auto; padding: 2rem; background: white; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.08); }
        .card h1 { margin-top: 0; color: #333; font-size: 1.8rem; }
        .form-control { width: 100%; padding: 0.85rem 1rem; margin-bottom: 1rem; border: 1px solid #d9d9d9; border-radius: 8px; }
        .btn { width: 100%; padding: 0.9rem 1rem; border: none; border-radius: 8px; background: #4f46e5; color: white; font-size: 1rem; cursor: pointer; }
        .links { margin-top: 1rem; text-align: center; color: #555; }
        .links a { color: #4f46e5; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Log in</h1>
        <form method="post" novalidate>
            {% csrf_token %}
            {% if form.non_field_errors %}
                <div style="margin-bottom: 1rem; color: #b91c1c;">{{ form.non_field_errors }}</div>
            {% endif %}
            <div>
                {{ form.username.label_tag }}
                {{ form.username }}
            </div>
            <div>
                {{ form.password.label_tag }}
                {{ form.password }}
            </div>
            <button type="submit" class="btn">Sign in</button>
        </form>
        <div class="links">
            <p><a href="/">Return to gallery</a></p>
        </div>
    </div>
</body>
</html>
