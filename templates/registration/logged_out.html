<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged out</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.08); max-width: 420px; text-align: center; }
        .box h1 { margin: 0 0 1rem; color: #111827; }
        .box a { display: inline-block; margin-top: 1.5rem; padding: 0.75rem 1.25rem; background: #2563eb; color: white; text-decoration: none; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Logged out</h1>
        <p>You have been signed out successfully.</p>
        <a href="/">Go back to gallery</a>
    </div>
</body>
</html>
